# =============================================================================
# QualiCart - Pipeline de Quality Gates (CI/CD)
# =============================================================================
# Módulo 1 - Testes & Qualidade
#
# Princípio didático: os gates são ordenados do MAIS BARATO/RÁPIDO ao MAIS CARO,
# de forma a FALHAR CEDO ("fail fast") e não desperdiçar minutos de runner.
#
# Ordem dos gates (barato -> caro):
#   1. lint      (ESLint)          -.
#   2. typecheck (tsc --noEmit)    -'  << rápidos e INDEPENDENTES: rodam em PARALELO
#   3. test      (unit + coverage) <<  só roda se lint E typecheck passarem
#   4. bdd       (Cucumber/E2E)    <<  comportamento por último (mais caro/lento)
#
# Cobertura é tratada como PISO (piso mínimo aceitável), NUNCA como teto: o
# objetivo é impedir regressões abaixo do limiar, e não desencorajar cobrir mais.
# =============================================================================

name: CI

on:
  push:
  pull_request:

# Cancela execuções antigas do mesmo ref quando um novo push chega (economia).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # GATE 1 (barato) - Lint
  # ESLint: estilo e problemas estáticos. Roda em paralelo com o typecheck.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x   # LTS com type stripping nativo estável
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ---------------------------------------------------------------------------
  # GATE 1.b (barato) - SAST (Static Application Security Testing)
  # Módulo 3 — Segurança shift-left. Analisa o PRÓPRIO código em busca de
  # padrões perigosos usando o eslint-plugin-security (injeção de objeto, uso
  # de child_process, regex ReDoS, caminho de arquivo não-literal, ...).
  #
  # Roda `npm run lint`, que já carrega o plugin de segurança pelo flat config
  # (eslint.config.js). É um job dedicado/rótulo de SAST para deixar o gate de
  # segurança visível no pipeline; posicionado CEDO, junto dos gates baratos.
  # As regras de segurança são "warn" de propósito (ver eslint.config.js): o
  # lint expõe o sinal na saída sem quebrar por falso positivo. A evolução
  # natural deste gate é apertar para `eslint . --max-warnings=<n>` conforme a
  # base é limpa, tornando qualquer NOVO achado um bloqueio que força revisão
  # e supressão justificada.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (ESLint security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Reporta os achados de segurança (e demais avisos) de forma visível.
      - run: npm run lint

  # ---------------------------------------------------------------------------
  # GATE 1.c (barato) - SCA (Software Composition Analysis)
  # Módulo 3 — Analisa as DEPENDÊNCIAS (não o nosso código) contra advisories
  # conhecidas. `npm audit --audit-level=high` FALHA o build somente em
  # vulnerabilidades de severidade ALTA ou CRÍTICA. Advisories moderadas/baixas
  # (hoje só transitivas de ferramentas de teste — stryker/cucumber, sem impacto
  # em runtime de produção) são reportadas mas NÃO quebram o gate. Se algo de
  # severidade alta surgir na árvore de produção (ex.: `pg`), este gate barra.
  # Posicionado CEDO (shift-left): vulnerabilidade de dependência é barata de
  # pegar e cara de descobrir tarde.
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # GATE 2 (barato) - Typecheck
  # tsc --noEmit: verificação de tipos. Independente do lint => roda em PARALELO.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # ---------------------------------------------------------------------------
  # GATE 3 (médio) - Testes de unidade + GATE DE COBERTURA
  # Só executa se lint E typecheck passarem (needs). Assim não gastamos recurso
  # rodando a suíte se o barato já falhou (fail fast).
  #
  # A cobertura usa o coverage NATIVO do Node (--experimental-test-coverage).
  # O GATE é aplicado pelos flags nativos de limiar; quando a cobertura fica
  # abaixo do alvo, o `node --test` retorna exit code != 0 e FALHA o job.
  #
  # Limiares escolhidos (PISO, não teto), na faixa ~70-80% sugerida pela
  # disciplina, ligeiramente conservadores para não ficarem flaky:
  #   * lines     = 0.75  -> domínio (carrinho/cupom/frete) atinge ~80%+;
  #                          margem para os ramos não cobertos do checkout.ts.
  #   * functions = 0.75  -> a maioria das funções de domínio é exercitada.
  #   * branches  = 0.65  -> ramos são o eixo mais difícil; checkout.ts
  #                          (orquestrador) tem caminhos de erro parcialmente
  #                          cobertos, então mantemos o piso um pouco mais baixo
  #                          para passar com folga realista sem virar flaky.
  # Estes números são PISO: subir a cobertura sempre é bem-vindo.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Run tests with native coverage threshold gate
        run: >-
          node --test
          --experimental-test-coverage
          --test-coverage-lines=0.75
          --test-coverage-functions=0.75
          --test-coverage-branches=0.65
          "packages/*/test/unit/**/*.test.ts"

  # ---------------------------------------------------------------------------
  # GATE 4 (médio) - BDD / Cucumber
  # Comportamento em linguagem de negócio. Depende de `test`.
  # ---------------------------------------------------------------------------
  bdd:
    name: BDD (Cucumber)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run bdd

  # ---------------------------------------------------------------------------
  # Módulo 2 — gates do distribuído. Rodam após a unidade (needs: [test]).
  # ---------------------------------------------------------------------------

  # GATE 5 - Contract testing (Pact): consumidor gera o pact e o provedor o
  # verifica. Barato e sem subir o sistema inteiro — pega quebras de contrato.
  contract:
    name: Contract tests (Pact)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:contract

  # GATE 6 - Integração com testcontainers. O runner ubuntu já traz Docker,
  # então o Postgres real sobe em contêiner descartável.
  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # GATE 7 (caro) - E2E com Playwright. Só a jornada crítica de checkout.
  # Instala o browser e sobe os serviços via webServer do próprio Playwright.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Nota: carga (k6) e chaos NÃO são gates por-PR — são experimentos sob
  # demanda (rodados manualmente / em ambiente parecido com produção), como
  # discutido no Módulo 2. Ver load/ e chaos/.
