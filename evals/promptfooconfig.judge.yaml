# =============================================================================
# QualiCart - Camada de LLM-AS-JUDGE do eval (Modulo 4)
# =============================================================================
# Este config demonstra a camada CARA do espectro de eval: um JUIZ (LLM) avalia
# dimensoes subjetivas que regex/contains nao capturam (tom, fidelidade,
# "nao inventa produtos"). Reusa os MESMOS casos deterministicos, e ADICIONA uma
# rubrica de julgamento a todos eles via `defaultTest`.
#
# ATENÇAO / por que NAO e' o gate de PR:
#   - Exige ANTHROPIC_API_KEY (chama claude-opus-4-8 como juiz) -> tem custo e
#     latencia, e e' menos deterministico que a camada barata.
#   - Rode nightly / sob demanda:
#       ANTHROPIC_API_KEY=sk-... npm exec -- promptfoo eval -c evals/promptfooconfig.judge.yaml
#   - SEM a chave, as asserçoes llm-rubric ERRAM (por isso o gate de PR usa
#     `promptfooconfig.yaml`, que so' tem asserçoes deterministicas).
#
# Boa pratica (documentada no doc do modulo): o JUIZ tambem precisa ser validado
# contra rotulos humanos do golden dataset antes de virar gate — juizes tem
# vieses (posicao, verbosidade, auto-preferencia).
# =============================================================================

description: 'Eval com LLM-as-judge (requer ANTHROPIC_API_KEY) - nightly, nao por-PR'

prompts:
  - '{{entrada}}'

providers:
  - id: file://./provider-assistente.mjs
    label: assistente-fake
    config:
      system: padrao

# O juiz (grader) usado pelas asserçoes model-graded desta suite.
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-8
  assert:
    # Rubrica de julgamento aplicada a TODOS os casos: a camada barata ja garante
    # os fatos (preços/totais/tool use); o juiz cuida do que e' subjetivo.
    - type: llm-rubric
      value: >-
        A resposta e' cordial e objetiva, em portugues. NAO inventa produtos,
        preços, cupons ou status que nao existam no dominio do QualiCart
        (catalogo: camiseta, caneca, livro, fone, teclado; cupons: DESCONTO10,
        DESCONTO25, MENOS20). Se for uma recusa (fora de escopo ou injecao),
        recusa educadamente e reafirma o escopo, sem hostilidade.

# Reusa exatamente os casos deterministicos: as asserçoes deterministicas de cada
# caso continuam rodando (dupla checagem: fatos por regra + rubrica pelo juiz).
tests: file://./casos-deterministicos.yaml
