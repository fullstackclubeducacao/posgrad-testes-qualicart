<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QualiCart — Checkout</title>
    <style>
      :root {
        --azul: #0a7d6b;
        --azul-forte: #075d50;
        --borda: #d5dbe0;
        --fundo: #f4f6f8;
        --texto: #1c2126;
        --texto-suave: #6b7480;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--fundo);
        color: var(--texto);
        line-height: 1.5;
      }
      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }
      h1 {
        margin: 0 0 24px;
        padding: 20px 24px;
        font-size: 28px;
        color: #ffffff;
        background: var(--azul);
        border-radius: 10px;
      }
      section {
        background: #ffffff;
        border: 1px solid var(--borda);
        border-radius: 10px;
        padding: 18px 20px;
        margin: 0 0 20px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--azul-forte);
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
      li {
        margin: 4px 0;
      }
      form {
        background: #ffffff;
        border: 1px solid var(--borda);
        border-radius: 10px;
        padding: 18px 20px;
        margin: 0 0 20px;
      }
      form p {
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .ajuda {
        display: block;
        font-size: 13px;
        /* AJUSTE ACESSIBILIDADE: texto de apoio usa cinza legivel (--texto-suave,
           contraste >= 4.5:1). A versao anterior usava #c4c9ce, reprovado pelo
           axe (color-contrast, serious). */
        color: var(--texto-suave);
        margin-top: 4px;
      }
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid var(--borda);
        border-radius: 8px;
      }
      input[type='text']:focus {
        outline: 2px solid var(--azul);
        outline-offset: 1px;
      }
      button {
        background: var(--azul);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--azul-forte);
      }
      pre {
        background: var(--fundo);
        border-radius: 8px;
        padding: 12px;
        margin: 0 0 12px;
        white-space: pre-wrap;
        font-size: 14px;
      }
      #resultado-total {
        font-size: 18px;
        color: var(--azul-forte);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QualiCart</h1>

      <section aria-labelledby="titulo-itens">
        <h2 id="titulo-itens">Itens do carrinho</h2>
        <ul>
          <li>Camiseta — R$ 59,90 x 2</li>
          <li>Caneca — R$ 39,90 x 1</li>
        </ul>
      </section>

      <form id="form-checkout">
        <p>
          <label for="cupom">Cupom de desconto</label>
          <input id="cupom" name="cupom" type="text" placeholder="Ex.: DESCONTO10" />
          <span class="ajuda">Opcional. Informe um cupom valido para aplicar desconto.</span>
        </p>

        <p>
          <label for="cep">CEP de entrega</label>
          <input id="cep" name="cep" type="text" placeholder="00000-000" />
          <span class="ajuda">Usamos o CEP apenas para calcular o frete.</span>
        </p>

        <p>
          <button type="submit">Finalizar</button>
        </p>
      </form>

      <section aria-live="polite">
        <h2>Resumo</h2>
        <pre id="resultado">Preencha e clique em Finalizar.</pre>
        <p>
          Total do pedido:
          <strong id="resultado-total" data-status="pendente">—</strong>
        </p>
      </section>
    </main>

    <script>
      const form = document.getElementById('form-checkout');
      const saida = document.getElementById('resultado');
      const saidaTotal = document.getElementById('resultado-total');

      const ITENS = [
        { sku: 'CAM-001', quantidade: 2 },
        { sku: 'CAN-001', quantidade: 1 },
      ];

      form.addEventListener('submit', async (evento) => {
        evento.preventDefault();

        const codigoCupom = document.getElementById('cupom').value.trim();
        const cep = document.getElementById('cep').value.trim();

        const corpo = {
          itens: ITENS,
          cupom: codigoCupom
            ? { tipo: 'percentual', valor: 10 }
            : null,
          cep,
        };

        try {
          const resposta = await fetch('/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(corpo),
          });
          const dados = await resposta.json();
          saida.textContent =
            'Subtotal: R$ ' + dados.subtotal.toFixed(2) + '\n' +
            'Desconto: R$ ' + dados.desconto.toFixed(2) + '\n' +
            'Frete: R$ ' + dados.frete.toFixed(2) + '\n' +
            'Total: R$ ' + dados.total.toFixed(2);
          saidaTotal.textContent = 'R$ ' + dados.total.toFixed(2);
          saidaTotal.dataset.status = 'ok';
        } catch {
          saida.textContent = 'Erro ao processar o checkout.';
          saidaTotal.textContent = '—';
          saidaTotal.dataset.status = 'erro';
        }
      });
    </script>
  </body>
</html>
